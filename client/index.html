<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoblinChat | Giriş</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="simple-wrap">
      <header class="top-bar">
        <h1>GoblinChat</h1>
        <button id="themeToggle" class="ghost" type="button">🌙 Karanlık</button>
      </header>

      <section class="card auth-card">
        <h2>Giriş / Kayıt</h2>
        <p class="muted">Sohbet ekranı ayrı sayfada açılır.</p>

        <div class="tabs">
          <button id="tabLogin" class="active" type="button">Giriş</button>
          <button id="tabRegister" type="button">Kayıt</button>
        </div>

        <form id="authForm">
          <label>Kullanıcı adı<input type="text" id="username" required minlength="3" /></label>
          <label>Şifre<input type="password" id="password" required minlength="6" /></label>
          <label id="inviteWrap" class="hidden">Davet kodu<input type="text" id="inviteCode" placeholder="İAZEMY68" /></label>
          <button type="submit" id="authSubmit" class="primary">Giriş Yap</button>
        </form>

        <p id="authMessage" class="status"></p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
