<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Çift Analog Gösterge Paneli</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111a33;
        --text: #e5eefc;
        --muted: #a9b8da;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background:
          radial-gradient(circle at 15% 15%, #24386f, transparent 26%),
          radial-gradient(circle at 85% 85%, #213d74, transparent 24%),
          var(--bg);
        color: var(--text);
      }

      .panel {
        width: min(96vw, 980px);
        background: linear-gradient(160deg, #141f3d, #0d152b);
        border: 1px solid rgba(136, 162, 224, 0.25);
        border-radius: 24px;
        padding: 24px;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      }

      h1 {
        text-align: center;
        margin: 0 0 20px;
        font-size: clamp(1.2rem, 2.6vw, 1.8rem);
      }

      .gauges {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 24px;
      }

      .gauge-card {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0));
        border: 1px solid rgba(141, 170, 236, 0.22);
        border-radius: 18px;
        padding: 16px;
      }

      .gauge-title {
        text-align: center;
        margin: 0 0 10px;
        font-size: 1rem;
        color: var(--muted);
      }

      .gauge {
        width: min(100%, 320px);
        aspect-ratio: 1;
        margin: 0 auto;
        border-radius: 50%;
        position: relative;
        border: 8px solid #263867;
        background: radial-gradient(circle at center, #182650 55%, #121e40 56%);
        box-shadow: inset 0 0 22px rgba(0, 0, 0, 0.5);
      }

      .zone {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        clip-path: polygon(50% 50%, 0 0, 100% 0);
      }

      .zone.green {
        background: conic-gradient(from -135deg, rgba(16, 185, 129, 0.8) 0deg, rgba(16, 185, 129, 0.8) 108deg, transparent 108deg);
      }

      .zone.yellow {
        background: conic-gradient(from -27deg, rgba(245, 158, 11, 0.85) 0deg, rgba(245, 158, 11, 0.85) 81deg, transparent 81deg);
      }

      .zone.red {
        background: conic-gradient(from 54deg, rgba(239, 68, 68, 0.88) 0deg, rgba(239, 68, 68, 0.88) 81deg, transparent 81deg);
      }

      .zone-mask {
        position: absolute;
        inset: 34px;
        border-radius: 50%;
        background: #182650;
      }

      .glass {
        position: absolute;
        inset: 14px;
        border-radius: 50%;
        background:
          linear-gradient(155deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.02) 37%, rgba(255, 255, 255, 0.16) 100%);
        box-shadow: inset 0 0 16px rgba(255, 255, 255, 0.14);
        pointer-events: none;
      }

      .tick {
        position: absolute;
        width: 3px;
        height: 12px;
        background: #d2e0ff;
        left: 50%;
        top: 18px;
        transform-origin: 50% 132px;
      }

      .label {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .needle {
        position: absolute;
        width: 5px;
        height: 120px;
        left: calc(50% - 2.5px);
        bottom: 50%;
        border-radius: 6px;
        transform-origin: 50% 100%;
        transform: rotate(-135deg);
        transition: transform 0.9s cubic-bezier(0.17, 0.67, 0.24, 1.28);
        z-index: 5;
      }

      .needle.blue {
        background: linear-gradient(#9cd2ff, #2f84ea);
      }

      .needle.orange {
        background: linear-gradient(#ffc48a, #f97316);
      }

      .hub {
        position: absolute;
        width: 24px;
        height: 24px;
        left: calc(50% - 12px);
        top: calc(50% - 12px);
        border-radius: 50%;
        background: #d4e4ff;
        box-shadow: 0 0 0 4px #1c2d5a;
        z-index: 6;
      }

      .value {
        margin: 12px 0 0;
        text-align: center;
        font-size: 1.25rem;
        font-weight: 800;
      }

      .controls {
        margin-top: 20px;
        display: flex;
        justify-content: center;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(90deg, #38bdf8, #6366f1);
        color: white;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Çift Analog Gösterge (Cam Efekt + Yeşil/Sarı/Kırmızı Bölge)</h1>

      <section class="gauges">
        <article class="gauge-card">
          <h2 class="gauge-title">Basınç</h2>
          <div class="gauge" id="gauge1">
            <div class="zone green"></div>
            <div class="zone yellow"></div>
            <div class="zone red"></div>
            <div class="zone-mask"></div>
            <div class="needle blue" id="needle1"></div>
            <div class="hub"></div>
            <div class="glass"></div>
          </div>
          <p class="value"><span id="value1">0</span>%</p>
        </article>

        <article class="gauge-card">
          <h2 class="gauge-title">Sıcaklık</h2>
          <div class="gauge" id="gauge2">
            <div class="zone green"></div>
            <div class="zone yellow"></div>
            <div class="zone red"></div>
            <div class="zone-mask"></div>
            <div class="needle orange" id="needle2"></div>
            <div class="hub"></div>
            <div class="glass"></div>
          </div>
          <p class="value"><span id="value2">0</span>%</p>
        </article>
      </section>

      <div class="controls">
        <button id="animateBtn">Göstergeleri Hareket Ettir</button>
      </div>
    </main>

    <script>
      const gauges = [
        { gauge: document.getElementById('gauge1'), needle: document.getElementById('needle1'), label: document.getElementById('value1') },
        { gauge: document.getElementById('gauge2'), needle: document.getElementById('needle2'), label: document.getElementById('value2') }
      ];

      function buildScale(gauge) {
        for (let i = 0; i <= 100; i += 5) {
          const angle = -135 + (i / 100) * 270;

          const tick = document.createElement('span');
          tick.className = 'tick';
          tick.style.height = i % 10 === 0 ? '17px' : '10px';
          tick.style.transform = `translateX(-50%) rotate(${angle}deg)`;
          gauge.appendChild(tick);

          if (i % 25 === 0) {
            const rad = ((angle - 90) * Math.PI) / 180;
            const r = 107;
            const x = 160 + r * Math.cos(rad);
            const y = 160 + r * Math.sin(rad);

            const label = document.createElement('span');
            label.className = 'label';
            label.style.left = `${x}px`;
            label.style.top = `${y}px`;
            label.textContent = i;
            gauge.appendChild(label);
          }
        }
      }

      function setGauge(index, value) {
        const safe = Math.max(0, Math.min(100, Math.round(value)));
        const angle = -135 + (safe / 100) * 270;
        const item = gauges[index];
        item.needle.style.transform = `rotate(${angle}deg)`;
        item.label.textContent = safe;
      }

      gauges.forEach((item) => buildScale(item.gauge));

      setGauge(0, 20);
      setGauge(1, 40);

      function animateGauges() {
        const target1 = Math.floor(Math.random() * 101);
        const target2 = Math.floor(Math.random() * 101);
        setGauge(0, target1);
        setGauge(1, target2);
      }

      document.getElementById('animateBtn').addEventListener('click', animateGauges);

      setInterval(animateGauges, 3000);
    </script>
  </body>
</html>
