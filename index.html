<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analog Gösterge</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef4ff, #f8fbff);
      }

      .card {
        width: min(92vw, 420px);
        background: #ffffff;
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 12px 30px rgba(23, 39, 77, 0.15);
      }

      h1 {
        margin: 0 0 14px;
        text-align: center;
        font-size: 1.25rem;
      }

      .gauge-wrap {
        display: grid;
        place-items: center;
      }

      .gauge {
        width: 300px;
        height: 300px;
        border-radius: 50%;
        background: radial-gradient(circle at center, #ffffff 54%, #ecf2ff 55%);
        border: 9px solid #182b57;
        position: relative;
      }

      .tick {
        position: absolute;
        width: 3px;
        height: 13px;
        background: #182b57;
        left: 50%;
        top: 8px;
        transform-origin: 50% 142px;
      }

      .label {
        position: absolute;
        font-size: 0.8rem;
        font-weight: 700;
        color: #182b57;
        transform: translate(-50%, -50%);
      }

      .needle {
        position: absolute;
        width: 5px;
        height: 120px;
        background: linear-gradient(#ff516f, #c50d33);
        left: calc(50% - 2.5px);
        bottom: 50%;
        border-radius: 6px;
        transform-origin: 50% 100%;
        transform: rotate(-135deg);
        transition: transform 0.25s ease-out;
      }

      .hub {
        position: absolute;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #182b57;
        left: calc(50% - 12px);
        top: calc(50% - 12px);
      }

      .value {
        text-align: center;
        margin-top: 16px;
        font-size: 1.35rem;
        font-weight: 800;
        color: #182b57;
      }

      .slider {
        margin-top: 14px;
      }

      input[type="range"] {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Analog Gösterge (0 - 100)</h1>
      <section class="gauge-wrap">
        <div class="gauge" id="gauge">
          <div class="needle" id="needle"></div>
          <div class="hub"></div>
        </div>
      </section>
      <p class="value"><span id="value">0</span>%</p>
      <div class="slider">
        <input id="range" type="range" min="0" max="100" step="1" value="0" />
      </div>
    </main>

    <script>
      const gauge = document.getElementById('gauge');
      const needle = document.getElementById('needle');
      const valueLabel = document.getElementById('value');
      const range = document.getElementById('range');

      // Ölçek çizgileri ve etiketler
      for (let i = 0; i <= 100; i += 5) {
        const angle = -135 + (i / 100) * 270;

        const tick = document.createElement('span');
        tick.className = 'tick';
        tick.style.transform = `translateX(-50%) rotate(${angle}deg)`;
        tick.style.height = i % 10 === 0 ? '18px' : '11px';
        gauge.appendChild(tick);

        if (i % 20 === 0) {
          const rad = ((angle - 90) * Math.PI) / 180;
          const radius = 108;
          const x = 150 + radius * Math.cos(rad);
          const y = 150 + radius * Math.sin(rad);

          const label = document.createElement('span');
          label.className = 'label';
          label.style.left = `${x}px`;
          label.style.top = `${y}px`;
          label.textContent = i;
          gauge.appendChild(label);
        }
      }

      function setGauge(value) {
        const clamped = Math.max(0, Math.min(100, Number(value)));
        const angle = -135 + (clamped / 100) * 270;
        needle.style.transform = `rotate(${angle}deg)`;
        valueLabel.textContent = clamped;
      }

      range.addEventListener('input', (event) => {
        setGauge(event.target.value);
      });

      setGauge(range.value);
    </script>
  </body>
</html>
