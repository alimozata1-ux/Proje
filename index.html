<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mohittin Abi Yazılım • Abone Sayacı</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card" aria-labelledby="title">
        <header class="card__header">
          <span class="icon" aria-hidden="true">
            <img src="assets/icons/youtube.svg" alt="" />
          </span>
          <div>
            <p class="eyebrow">Canlı Abone Sayacı</p>
            <h1 id="title">Mohittin Abi Yazılım</h1>
          </div>
        </header>

        <p class="channel-link">
          Kanal:
          <a
            href="https://www.youtube.com/@Mohittin_Abi_Yazılım-t6v"
            target="_blank"
            rel="noopener noreferrer"
            >youtube.com/@Mohittin_Abi_Yazılım-t6v</a
          >
        </p>

        <div class="counter" role="status" aria-live="polite">
          <span class="icon" aria-hidden="true">
            <img src="assets/icons/users.svg" alt="" />
          </span>
          <strong id="subscriberCount">Yükleniyor...</strong>
          <small>abone</small>
        </div>

        <p id="statusMessage" class="status">Veri alınıyor...</p>

        <button id="refreshBtn" class="refresh-btn" type="button">
          <span class="icon" aria-hidden="true">
            <img src="assets/icons/refresh.svg" alt="" />
          </span>
          Yenile
        </button>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
