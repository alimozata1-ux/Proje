<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BİLADER</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 id="logo">BİLADER</h1>
      <p id="status">BAĞLANTI TAMAMLANDI, BİLADER.</p>
    </header>

    <main class="layout">
      <section class="chat">
        <div id="history" class="history"></div>

        <div class="composer">
          <input id="prompt" type="text" placeholder="Bilader, bir şey sor..." />
          <button id="sendBtn">Gönder</button>
          <button id="voiceBtn">🎤 Konuş</button>
        </div>

        <pre id="codePanel" class="code" placeholder="Kod çıktısı"></pre>
      </section>

      <aside class="side">
        <button id="refreshHistoryBtn">Geçmişi Yenile</button>
        <button id="snapshotBtn">Sistem Durumu</button>
        <button id="arduinoBtn">Arduino Bağla/Kes</button>
        <button id="tempBtn">Sıcaklık Oku</button>

        <pre id="sidePanel" class="panel"></pre>
      </aside>
    </main>
  </div>

  <template id="itemTpl">
    <div class="item">
      <div class="meta">
        <span class="role"></span>
        <span class="time"></span>
      </div>
      <div class="content"></div>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
